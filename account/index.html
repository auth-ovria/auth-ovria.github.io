
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f9f9">
  <title>Мой аккаунт — Ovria Accounts</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f7f9f9;
      color: #111;
    }

    header {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8%;
      background: white;
      border-bottom: 1px solid #e8eeee;
    }

    header img {
      width: 85px;
      height: 85px;
      object-fit: contain;
    }

    header a {
      color: #168e94;
      text-decoration: none;
      font-size: 14px;
    }

    main {
      max-width: 850px;
      margin: 65px auto;
      padding: 0 22px;
    }

    h1 { font-size: 32px; }

    .subtitle { color: #788282; }

    .card {
      margin-top: 25px;
      padding: 27px;
      background: white;
      border: 1px solid #e8eeee;
      border-radius: 15px;
    }

    .card h2 { margin-top: 0; }

    .info {
      padding: 14px 0;
      border-bottom: 1px solid #edf0f0;
    }

    .info:last-child { border-bottom: 0; }

    .label {
      display: block;
      margin-bottom: 6px;
      color: #788282;
      font-size: 13px;
    }

    .value { font-size: 16px; }

    button {
      margin-top: 22px;
      padding: 13px 22px;
      border: 0;
      border-radius: 9px;
      background: #168e94;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    #message {
      color: #788282;
      line-height: 1.5;
    }

    footer {
      padding: 25px;
      text-align: center;
      color: #899292;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <img src="../logo.png" alt="Ovria">
    <a href="../">На главную</a>
  </header>

  <main>
    <h1>Мой аккаунт</h1>
    <p class="subtitle">Управление учётной записью Ovria.</p>

    <section class="card">
      <h2>Информация</h2>

      <div class="info">
        <span class="label">Имя пользователя</span>
        <span class="value" id="username">Загрузка...</span>
      </div>

      <div class="info">
        <span class="label">Email</span>
        <span class="value" id="email">Загрузка...</span>
      </div>

      <div class="info">
        <span class="label">Дата создания</span>
        <span class="value" id="created">Загрузка...</span>
      </div>

      <p id="message" role="status"></p>
      <button id="logoutButton" type="button">Выйти из аккаунта</button>
    </section>
  </main>

  <footer>© 2026 Ovria. All rights reserved.</footer>

  <script>
    const API = "https://herself.fxtun.ru";
    const token = sessionStorage.getItem("ovria_access_token");

    const message = document.getElementById("message");

    function goToSignIn() {
      sessionStorage.removeItem("ovria_access_token");
      sessionStorage.removeItem("ovria_username");
      window.location.replace("../signin/");
    }

    async function loadAccount() {
      if (!token) {
        goToSignIn();
        return;
      }

      try {
        const response = await fetch(`${API}/me`, {
          headers: {
            "Authorization": `Bearer ${token}`
          }
        });

        if (response.status === 401) {
          goToSignIn();
          return;
        }

        if (!response.ok) {
          throw new Error("Не удалось загрузить данные аккаунта.");
        }

        const user = await response.json();

        document.getElementById("username").textContent = user.username;
        document.getElementById("email").textContent = user.email;

        document.getElementById("created").textContent =
          new Date(user.created_at).toLocaleDateString("ru-RU");

        message.textContent = "";
      } catch (error) {
        message.textContent = error.message === "Failed to fetch"
          ? "Не удалось связаться с сервером."
          : error.message;
      }
    }

    document.getElementById("logoutButton").addEventListener("click", async () => {
      try {
        await fetch(`${API}/logout`, {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${token}`
          }
        });
      } finally {
        goToSignIn();
      }
    });

    loadAccount();
  </script>
</body>
</html>
